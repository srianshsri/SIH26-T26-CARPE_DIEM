<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareGrid · ABHA Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div id="app-nav"></div>

<div class="login-shell">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3.2v5.4c0 4.7-3 8.9-7 10.4-4-1.5-7-5.7-7-10.4V6.2L12 3z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12.3l2.1 2.1L15.5 10" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Log in with ABHA</h1>
    <p class="sub">Enter the patient's Ayushman Bharat Health Account ID to load their verified medical history.</p>

    <div class="field" id="abha-field">
      <label for="abha-input">ABHA ID</label>
      <input id="abha-input" type="text" inputmode="numeric" placeholder="XX-XXXX-XXXX-XXXX" maxlength="17" autocomplete="off">
      <div class="hint">14-digit ID printed on the patient's ABHA card or app.</div>
      <div class="error-msg" id="abha-error">We couldn't find a record for that ABHA ID. Check the number and try again.</div>
    </div>

    <button class="btn btn-primary btn-block" id="login-btn">Verify &amp; continue</button>

    <div class="demo-ids">
      <span class="eyebrow">Prototype shortcut — sample ABHA IDs</span>
      <div id="demo-list"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
